name: API tests

on:
  push:
    branches: [main]
    paths: ["server/**", "shared/**", "client/src/lib/access.js", "client/src/lib/ats/**", "client/src/lib/resume.js", "client/src/pdf/**", ".github/workflows/api-tests.yml"]
  pull_request:
    paths: ["server/**", "shared/**", "client/src/lib/access.js", "client/src/lib/ats/**", "client/src/lib/resume.js", "client/src/pdf/**", ".github/workflows/api-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      # The parity test loads the client's template registry and access rules.
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: server
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/resumex_test
